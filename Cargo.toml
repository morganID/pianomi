[package]
name = "pianomi"
version = "0.5.0"
edition = "2021"
description = "Play MIDI files into Roblox piano games — keyboard replay or real MIDI output, with humanization (CLI + macOS menu bar app)"
license = "MIT"
repository = "https://github.com/morganID/pianomi"
homepage = "https://github.com/morganID/pianomi"
readme = "README.md"
keywords = ["midi", "roblox", "piano", "automation", "music"]
categories = ["command-line-utilities", "multimedia::audio"]

[lib]
name = "pianomi"
path = "src/lib.rs"

[[bin]]
name = "pianomi"
path = "src/main.rs"

[[bin]]
name = "pianomi-gui"
path = "src/gui.rs"

[dependencies]
# Fast, allocation-light Standard MIDI File (SMF) parser
midly = "0.5"
# Cross-platform (Windows / macOS / Linux) keyboard & mouse simulation
enigo = "0.6"
# Pseudo-random numbers for the humanization layer
rand = "0.8"
# Ergonomic command-line argument parsing
clap = { version = "4", features = ["derive"] }
# Serialization framework for the TOML config
serde = { version = "1", features = ["derive"] }
# TOML (de)serialization
toml = "0.8"
# Ergonomic error handling
anyhow = "1"
# Native tray / menu bar + event loop (macOS status item app)
tao = "0.30"
# Cross-platform tray (menu bar) icon
tray-icon = "0.19"
# Native menus for the tray
muda = "0.15"
# Native file/directory dialogs for the GUI
rfd = "0.15"
# MIDI output: publish a virtual port or connect to an existing destination
# (CoreMIDI on macOS, ALSA on Linux, WinMM on Windows).
midir = "0.10"

# macOS: post key events with per-event modifier flags, so a sharp never needs
# the real Shift key to be pressed (see src/keycode.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# `elcapitan` exposes CGEvent::post_to_pid, used by --target-roblox to scope
# key events to the Roblox process instead of the global HID tap.
core-graphics = { version = "0.25", features = ["elcapitan"] }
# `CGEvent` is a foreign_type; the ForeignType trait supplies as_ptr(), which
# we need for the CGEventSetTimestamp shim (the crate has no timestamp API).
foreign-types = "0.5"
# Used by examples/probe_keys.rs to pump a run loop while an event tap listens.
core-foundation = "0.10"
# AppKit focus helpers (NSWorkspace / NSRunningApplication) for the menu bar
# app. Already in the dependency tree via tao; declared directly so src/focus.rs
# can use the Objective-C runtime without pulling in a second bridge.
objc = "0.2"
# Cheap `kill(pid, 0)` liveness probe for the Roblox PID watcher (avoids
# spawning `pgrep` on the playback thread).
libc = "0.2"
