# Transpose applied to every note (semitones) before lookup. Positive = up.
# The whole 88-key range is mapped, so songs spanning F2(41)..A7(105) such as
# "Spring Thief" play in full. Only notes outside A0..C8 are skipped.
keyboard.transpose = 0

# ---------------------------------------------------------------------------
# Humanization
# ---------------------------------------------------------------------------
[humanize]
# All of these are scaled by the --humanize level, so 0 plays the file exactly
# as written.
timing_variation_ms = 35
duration_variation_ms = 25
chord_delay_ms = 18
# Softer notes are held slightly less (a velocity of 127 keeps the written
# length). This never *lengthens* a note: one that outlasts the next note on
# the same key cannot be retriggered, so that next note would be lost.
use_velocity_for_duration = true

# ---------------------------------------------------------------------------
# Player
# ---------------------------------------------------------------------------
[player]
start_delay_ms = 3000
min_hold_ms = 30
tick_ms = 1
loop_gap_ms = 800

# How a black key (a sharp like "!" or "S") is delivered.
#
#   "key"  — real Shift down, the key, Shift up, scoped to this one note.
#            Roblox's Virtual Piano reads UserInputService:IsKeyDown(LeftShift),
#            which only ever sees a *real* modifier key, never an event flag —
#            so this is the default. The key event also carries the Shift flag
#            and the typed character, so nothing is lost.
#   "char" — one event: the base keycode with the Shift FLAG and the literal
#            character attached, no real modifier. Only use this for a game
#            that reacts to the typed character; under Roblox it delivers every
#            sharp as the natural below it.
#
# Both avoid the old bug where Shift stayed down for the whole note and turned
# every white key pressed in the meantime into a sharp.
shift_mode = "key"

