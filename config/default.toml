# ============================================================================
# Default configuration for pianomi
# ---------------------------------------------------------------------------
# Maps MIDI note numbers (60 = middle C / C4) to the keyboard keys used by the
# Roblox "Virtual Piano" experience (mapping sourced from the well-known
# Virtual-Piano-Roblox-Player project). Edit freely or pass --config.
#
# BLACK KEYS USE SHIFT: a sharp is the SAME physical key as the white note
# one semitone below, played with Shift held. So "!" = Shift+1, "Q" = Shift+q,
# "@" = Shift+2, etc. The player derives the Shift modifier automatically.
#
# Range covered: A0 (21) .. C8 (108) — all 88 keys.
#   plain / Shift : C2 (36) .. C7 (96)
#   Ctrl + key    : A0 (21) .. B1 (35)  and  C#7 (97) .. C8 (108)
# ============================================================================

[game]
name = "Roblox Virtual Piano"
# Only used for display / logging.
window_title = "Roblox"

# ---------------------------------------------------------------------------
# Keyboard mapping (authoritative Virtual Piano Roblox layout)
# ---------------------------------------------------------------------------
