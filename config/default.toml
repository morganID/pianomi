# ---------------------------------------------------------------------------
# Extended octaves — Ctrl + key
# ---------------------------------------------------------------------------
# The in-game piano is 88 keys. The 27 keys outside C2..C7 are drawn dimmed
# because they need Ctrl held; the keys themselves are the same 36 QWERTY
# keys, walked chromatically from the start of the list.
#
#   left   A0 (21) .. B1 (35)  ->  Ctrl + 1 2 3 4 5 6 7 8 9 0 q w e r t
#   right  C#7 (97) .. C8 (108) ->  Ctrl + y u i o p a s d f g h j
#
# Black keys in this layer are NOT Shift+key: every semitone gets its own
# key, so the label is always the plain character (e.g. Ctrl+w, not Ctrl+W).

[[keyboard.keys]]
key = "1"
note = 21   # A0
mods = "ctrl"
[[keyboard.keys]]
key = "2"
note = 22   # A#0
mods = "ctrl"
[[keyboard.keys]]
key = "3"
note = 23   # B0
mods = "ctrl"
[[keyboard.keys]]
